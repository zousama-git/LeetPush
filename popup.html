<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetPush</title>
  <style>
    :root {
      --bg: #0d0e10; --card-bg: #141619; --border: #22262b;
      --text-main: #e1e4e8; --text-muted: #6a737d; --input-bg: #111316;
      --green: #10b981; --green-accent: #059669; --amber: #f59e0b; --red: #ef4444;
      --font-mono: "Courier New", Courier, monospace;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa; --card-bg: #ffffff; --border: #d0d7de;
        --text-main: #1f2328; --text-muted: #656d76; --input-bg: #ffffff;
      }
    }

    * { box-sizing: border-box; }

    body {
      width: 310px; margin: 0; padding: 16px;
      background: var(--bg); color: var(--text-main);
      font-family: var(--font-mono);
    }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
    .status-dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .toggle-wrap { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; }
    .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 20px; transition: .2s;
    }
    .slider:before {
      position: absolute; content: ""; height: 12px; width: 12px;
      left: 3px; bottom: 3px; background: var(--text-muted);
      border-radius: 50%; transition: .2s;
    }
    input:checked + .slider:before { transform: translateX(16px); background: var(--green); }

    .section-title {
      font-size: 10px; color: var(--text-muted); letter-spacing: 1px;
      margin-bottom: 8px; font-weight: 700;
    }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
    .stat-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 4px; padding: 10px 4px 6px; text-align: center;
      position: relative; overflow: hidden;
    }
    .stat-card::after { content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; }
    .stat-card.easy::after { background: var(--green); }
    .stat-card.medium::after { background: var(--amber); }
    .stat-card.hard::after { background: var(--red); }
    .stat-val { font-size: 20px; font-weight: 700; line-height: 1; margin-bottom: 6px; }
    .stat-card.easy .stat-val { color: var(--green); }
    .stat-card.medium .stat-val { color: var(--amber); }
    .stat-card.hard .stat-val { color: var(--red); }
    .stat-lbl { font-size: 9px; color: var(--text-muted); font-weight: 700; }

    .field-group { margin-bottom: 10px; }
    .field-label { font-size: 9px; color: var(--text-muted); margin-bottom: 4px; font-weight: 700; }
    .input-wrap { position: relative; }
    input[type="text"], input[type="password"] {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      color: var(--text-main); padding: 8px 10px; font-family: var(--font-mono);
      font-size: 11px; border-radius: 4px;
    }
    .input-wrap input { padding-right: 48px; }
    .toggle-pass {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      font-size: 10px; color: var(--text-muted); cursor: pointer;
      user-select: none;
    }
    .btn-save {
      width: 100%; margin-top: 14px; background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--green-accent); color: var(--green);
      font-family: var(--font-mono); font-size: 11px; font-weight: 700;
      padding: 10px; border-radius: 4px; cursor: pointer;
    }
    .btn-save:disabled { opacity: .6; cursor: wait; }
    #status-msg { min-height: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div id="statusDot" class="status-dot"></div>
      <span>LEETPUSH</span>
    </div>
    <div class="toggle-wrap">
      <label class="switch">
        <input type="checkbox" id="extensionToggle">
        <span class="slider"></span>
      </label>
      <span id="toggleStateText">OFF</span>
    </div>
  </div>

  <div class="section-title">SOLVED PROBLEMS</div>
  <div class="stats-grid">
    <div class="stat-card easy"><div id="countEasy" class="stat-val">00</div><div class="stat-lbl">EASY</div></div>
    <div class="stat-card medium"><div id="countMedium" class="stat-val">00</div><div class="stat-lbl">MED</div></div>
    <div class="stat-card hard"><div id="countHard" class="stat-val">00</div><div class="stat-lbl">HARD</div></div>
  </div>

  <div class="section-title">SETTINGS</div>

  <div class="field-group">
    <div class="field-label">GITHUB TOKEN</div>
    <div class="input-wrap">
      <input type="password" id="tokenInput" placeholder="github_pat_..." autocomplete="off">
      <span id="toggleTokenBtn" class="toggle-pass" role="button" tabindex="0">show</span>
    </div>
  </div>

  <div class="field-group">
    <div class="field-label">USERNAME</div>
    <input type="text" id="ownerInput" placeholder="octocat" autocomplete="off">
  </div>

  <div class="field-group">
    <div class="field-label">REPOSITORY</div>
    <input type="text" id="repoInput" placeholder="leetcode-solutions" autocomplete="off">
  </div>

  <button id="saveBtn" class="btn-save">SAVE CONFIGURATION</button>
  <div id="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
